name: Sincronizar Relay -> Supabase

on:
  schedule:
  
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: playwright install --with-deps chromium

      - name: Rodar sincronização
        env:
          EMAIL_AMAZON: ${{ secrets.EMAIL_AMAZON }}
          SENHA_AMAZON: ${{ secrets.SENHA_AMAZON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python testar_fluxo_relay.py

      - name: Upload Screenshot on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: erro-login-screenshot
          path: erro_login.png

      - name: Rodar sincronização
        env:
          AMAZON_COOKIES: ${{ secrets.AMAZON_COOKIES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python seu_script.py
